<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" href="data:," />
  <title>BUG SMASH: Deadline Hunter</title>
  <style>
    html, body {
      margin: 0; padding: 0; background: #1a1a1a;
      overflow: hidden; height: 100%; width: 100%;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game { display: flex; justify-content: center; align-items: center; height: 100vh; }

    /* Fullscreen overlay shown when phone is in portrait */
    #rotate-msg {
      display: none;
      position: fixed; inset: 0; z-index: 9999;
      background: #1a1a1a;
      color: #fff; font-family: Arial Black, sans-serif;
      text-align: center;
      flex-direction: column; justify-content: center; align-items: center;
      padding: 20px;
    }
    #rotate-msg .icon { font-size: 64px; animation: spin 2s ease-in-out infinite; }
    #rotate-msg h1 { font-size: 22px; margin: 18px 0 6px; }
    #rotate-msg p { font-size: 14px; color: #aab0c0; margin: 0; }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(90deg); }
      100% { transform: rotate(90deg); }
    }
    /* Only show the rotate overlay on touch devices in portrait */
    @media (hover: none) and (pointer: coarse) and (orientation: portrait) {
      #rotate-msg { display: flex; }
    }

  </style>
</head>
<body>
  <div id="game"></div>

  <div id="rotate-msg">
    <div class="icon">📱</div>
    <h1>Rotate your phone</h1>
    <p>This game is designed for landscape mode.</p>
  </div>

  <script>
    // Touch devices: go fullscreen + lock landscape on the FIRST tap, without eating it.
    // (Was a blocking "TAP TO PLAY" overlay — it swallowed the new player's first tap, so
    // START TRAINING / JUMP ONLINE needed two taps.) The listener is passive and on the
    // capture phase, so the same tap still reaches the game canvas. touchend counts as a
    // user activation, which requestFullscreen needs.
    (function () {
      const coarse = window.matchMedia && window.matchMedia('(hover: none) and (pointer: coarse)').matches;
      if (!coarse) return;
      const enterFullscreenAndLock = async () => {
        window.removeEventListener('touchend', enterFullscreenAndLock, true);
        try {
          const el = document.documentElement;
          if (!document.fullscreenElement) {
            if (el.requestFullscreen)            await el.requestFullscreen({ navigationUI: 'hide' });
            else if (el.webkitRequestFullscreen) await el.webkitRequestFullscreen();
          }
        } catch (e) { /* user cancelled or unsupported (iOS Safari) — the game still works */ }
        try {
          if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
        } catch (e) { /* unsupported — the rotate overlay still prompts a manual rotate */ }
      };
      window.addEventListener('touchend', enterFullscreenAndLock, { capture: true, passive: true });
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
  <script src="https://unpkg.com/colyseus.js@0.16.19/dist/colyseus.js"></script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
