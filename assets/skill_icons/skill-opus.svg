<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Senior Review — Power buff (purple + gold): the approving gavel, one hit = fixed -->
  <defs>
    <linearGradient id="bg-opus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c084d6"/>
      <stop offset="100%" stop-color="#5b2076"/>
    </linearGradient>
    <linearGradient id="hl-opus" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="22" fill="url(#bg-opus)" stroke="#2a0c38" stroke-width="3"/>
  <rect x="10" y="10" width="108" height="56" rx="16" fill="url(#hl-opus)"/>
  <!-- gavel head + handle -->
  <g transform="rotate(-38 64 64)">
    <rect x="34" y="30" width="56" height="26" rx="7" fill="#ffd23f" stroke="#2a0c38" stroke-width="3"/>
    <rect x="30" y="34" width="8" height="18" rx="3" fill="#fff3b0" stroke="#2a0c38" stroke-width="2"/>
    <rect x="86" y="34" width="8" height="18" rx="3" fill="#fff3b0" stroke="#2a0c38" stroke-width="2"/>
    <rect x="58" y="54" width="10" height="50" rx="4" fill="#ffffff" stroke="#2a0c38" stroke-width="3"/>
  </g>
  <!-- strike block -->
  <rect x="62" y="96" width="46" height="12" rx="4" fill="#ffffff" stroke="#2a0c38" stroke-width="3"/>
  <!-- impact sparks -->
  <g stroke="#ffd23f" stroke-width="4" stroke-linecap="round">
    <line x1="54" y1="94" x2="46" y2="88"/>
    <line x1="52" y1="104" x2="42" y2="104"/>
    <line x1="114" y1="88" x2="118" y2="82"/>
  </g>
  <text x="22" y="34" font-family="Arial Black, sans-serif" font-size="18" fill="#ffd23f" stroke="#2a0c38" stroke-width="1.5">✓</text>
</svg>
