<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Intern Bot — Random debuff (orange): a well-meaning bot rolling the dice -->
  <defs>
    <linearGradient id="bg-haiku" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff9a5a"/>
      <stop offset="100%" stop-color="#b8341e"/>
    </linearGradient>
    <linearGradient id="hl-haiku" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="22" fill="url(#bg-haiku)" stroke="#4a1208" stroke-width="3"/>
  <rect x="10" y="10" width="108" height="56" rx="16" fill="url(#hl-haiku)"/>
  <!-- die (tilted) -->
  <g transform="rotate(-12 60 66)">
    <rect x="28" y="34" width="64" height="64" rx="12" fill="#ffffff" stroke="#4a1208" stroke-width="3"/>
    <circle cx="44" cy="50" r="6" fill="#4a1208"/>
    <circle cx="60" cy="66" r="6" fill="#4a1208"/>
    <circle cx="76" cy="82" r="6" fill="#4a1208"/>
  </g>
  <!-- intern lanyard badge with "?" -->
  <circle cx="98" cy="96" r="15" fill="#ffd23f" stroke="#4a1208" stroke-width="3"/>
  <text x="98" y="103" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="20" fill="#4a1208">?</text>
  <!-- wobble marks -->
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" fill="none">
    <path d="M18 30 l6 -6 l4 6"/>
    <path d="M102 26 l6 6 l-6 4"/>
  </g>
</svg>
