<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Espresso Bot — Speed buff (blue): coffee cup + speed lines -->
  <defs>
    <linearGradient id="bg-sonnet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5b9bff"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="hl-sonnet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="22" fill="url(#bg-sonnet)" stroke="#0e1e4a" stroke-width="3"/>
  <rect x="10" y="10" width="108" height="56" rx="16" fill="url(#hl-sonnet)"/>
  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <line x1="14" y1="62" x2="30" y2="62"/>
    <line x1="10" y1="76" x2="30" y2="76"/>
    <line x1="16" y1="90" x2="30" y2="90"/>
  </g>
  <!-- steam -->
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round">
    <path d="M56 40 q-6 -8 0 -16 q6 -8 0 -14"/>
    <path d="M72 40 q-6 -8 0 -16 q6 -8 0 -14"/>
  </g>
  <!-- cup -->
  <path d="M38 48 h52 l-6 46 a8 8 0 0 1 -8 7 h-24 a8 8 0 0 1 -8 -7 z" fill="#ffffff" stroke="#0e1e4a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M88 58 h6 a10 10 0 0 1 0 20 h-8" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <rect x="44" y="54" width="40" height="8" rx="3" fill="#6b3b1f"/>
  <!-- lightning sticker -->
  <polygon points="66,66 54,84 63,84 58,98 74,78 65,78" fill="#ffd23f" stroke="#0e1e4a" stroke-width="2" stroke-linejoin="round"/>
</svg>
