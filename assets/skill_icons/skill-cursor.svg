<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Hot Desk — Utility (cyan/dark, with cursor-arrow + pin) -->
  <defs>
    <linearGradient id="bg-cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3aa8d8"/>
      <stop offset="100%" stop-color="#0a1a2a"/>
    </linearGradient>
    <linearGradient id="hl-cursor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="120" height="120" rx="22"
        fill="url(#bg-cursor)" stroke="#000000" stroke-width="3"/>
  <rect x="10" y="10" width="108" height="56" rx="16" fill="url(#hl-cursor)"/>

  <!-- Target reticle (cyan, behind cursor) -->
  <g stroke="#7ec8ff" stroke-width="3" fill="none" opacity="0.85">
    <circle cx="64" cy="64" r="34"/>
    <circle cx="64" cy="64" r="22"/>
    <line x1="20" y1="64" x2="32" y2="64" stroke-linecap="round"/>
    <line x1="96" y1="64" x2="108" y2="64" stroke-linecap="round"/>
    <line x1="64" y1="20" x2="64" y2="32" stroke-linecap="round"/>
    <line x1="64" y1="96" x2="64" y2="108" stroke-linecap="round"/>
  </g>
  <!-- Center dot -->
  <circle cx="64" cy="64" r="4" fill="#7ec8ff"/>

  <!-- Classic mouse cursor arrow, slightly offset for personality -->
  <g transform="translate(50 50) rotate(-12)">
    <polygon points="0,0 0,38 11,30 17,42 23,40 17,28 28,28"
             fill="#ffffff" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
</svg>
