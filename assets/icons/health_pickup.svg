<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Health pickup: green plus on white circle with black border + soft glow -->
  <!-- Outer glow ring -->
  <circle cx="32" cy="32" r="30" fill="#7ed957" opacity="0.25"/>
  <!-- Main circle background -->
  <circle cx="32" cy="32" r="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Inner accent ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="#7ed957" stroke-width="2" opacity="0.7"/>
  <!-- Plus symbol — horizontal bar -->
  <rect x="16" y="28" width="32" height="8" rx="2" fill="#2d8a3a" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Plus symbol — vertical bar -->
  <rect x="28" y="16" width="8" height="32" rx="2" fill="#2d8a3a" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Highlight on top of vertical bar -->
  <rect x="30" y="18" width="3" height="28" fill="#7ed957" opacity="0.6"/>
</svg>
