<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Dev Stickman: RUN pose, frame 2 (opposite stride from run.svg) -->

  <circle cx="68" cy="30" r="14" fill="#fcd9b6" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M57 24 Q62 16 68 18 Q76 14 80 24" fill="#2c1810" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="62" cy="31" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="74" cy="31" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="66" y1="31" x2="70" y2="31" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M65 38 Q68 41 71 38" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>

  <line x1="68" y1="44" x2="62" y2="82" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Arms swap: front arm now back, back arm now front (opposite swing) -->
  <line x1="66" y1="52" x2="42" y2="64" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="65" y1="52" x2="86" y2="62" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== LAPTOP held in front (still in front hand for consistency) ===== -->
  <g transform="rotate(15 90 62)">
    <polygon points="78,50 102,50 100,58 80,58"
             fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="81,51 99,51 97.5,57 82.5,57" fill="#4aa3ff"/>
    <line x1="83" y1="53" x2="93" y2="53" stroke="#fff" stroke-width="0.7" opacity="0.75"/>
    <line x1="83" y1="55" x2="96" y2="55" stroke="#fff" stroke-width="0.7" opacity="0.75"/>
    <line x1="80" y1="58" x2="100" y2="58" stroke="#1a1a1a" stroke-width="1"/>
    <polygon points="80,58 100,58 102,64 78,64"
             fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
    <g fill="#1a1a1a" opacity="0.55">
      <rect x="82" y="59.5" width="2" height="1" rx="0.2"/>
      <rect x="85" y="59.5" width="2" height="1" rx="0.2"/>
      <rect x="88" y="59.5" width="2" height="1" rx="0.2"/>
      <rect x="91" y="59.5" width="2" height="1" rx="0.2"/>
      <rect x="94" y="59.5" width="2" height="1" rx="0.2"/>
      <rect x="97" y="59.5" width="2" height="1" rx="0.2"/>
    </g>
  </g>

  <!-- Legs swapped: front leg is now the BACK leg (the one going BEHIND) -->
  <line x1="62" y1="82" x2="50" y2="100" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <!-- Back leg is now the LIFTED front knee -->
  <line x1="62" y1="82" x2="74" y2="98" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Feet -->
  <line x1="44" y1="102" x2="54" y2="102" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="100" x2="80" y2="100" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Speed lines behind -->
  <g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="22" y1="52" x2="36" y2="52"/>
    <line x1="18" y1="70" x2="34" y2="70"/>
    <line x1="24" y1="88" x2="40" y2="88"/>
  </g>
</svg>
