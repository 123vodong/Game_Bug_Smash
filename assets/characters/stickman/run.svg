<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Dev Stickman: RUN pose
       Body tilted forward, legs mid-stride, open laptop held in front hand -->

  <!-- Head, shifted slightly forward -->
  <circle cx="68" cy="30" r="14" fill="#fcd9b6" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Hair, blown back from speed -->
  <path d="M57 24 Q62 16 68 18 Q76 14 80 24" fill="#2c1810" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Glasses -->
  <circle cx="62" cy="31" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="74" cy="31" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="66" y1="31" x2="70" y2="31" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Mouth: open, determined -->
  <path d="M65 38 Q68 41 71 38" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Body: tilted forward -->
  <line x1="68" y1="44" x2="62" y2="82" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Front arm: extended forward toward laptop -->
  <line x1="65" y1="52" x2="88" y2="60" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <!-- Back arm: swung behind -->
  <line x1="66" y1="52" x2="46" y2="62" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== OPEN LAPTOP held in front hand, tilted ===== -->
  <g transform="rotate(15 92 60)">
    <!-- Screen panel -->
    <polygon points="80,48 104,48 102,56 82,56"
             fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="83,49 101,49 99.5,55 84.5,55" fill="#4aa3ff"/>
    <!-- Code line on screen -->
    <line x1="85" y1="51" x2="95" y2="51" stroke="#fff" stroke-width="0.7" opacity="0.75"/>
    <line x1="85" y1="53" x2="98" y2="53" stroke="#fff" stroke-width="0.7" opacity="0.75"/>
    <!-- Hinge -->
    <line x1="82" y1="56" x2="102" y2="56" stroke="#1a1a1a" stroke-width="1"/>
    <!-- Keyboard base -->
    <polygon points="82,56 102,56 104,62 80,62"
             fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
    <!-- Keys -->
    <g fill="#1a1a1a" opacity="0.55">
      <rect x="84" y="57.5" width="2" height="1" rx="0.2"/>
      <rect x="87" y="57.5" width="2" height="1" rx="0.2"/>
      <rect x="90" y="57.5" width="2" height="1" rx="0.2"/>
      <rect x="93" y="57.5" width="2" height="1" rx="0.2"/>
      <rect x="96" y="57.5" width="2" height="1" rx="0.2"/>
      <rect x="99" y="57.5" width="2" height="1" rx="0.2"/>
    </g>
  </g>

  <!-- Front leg: forward stride -->
  <line x1="62" y1="82" x2="80" y2="106" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <!-- Back leg: pushed back -->
  <line x1="62" y1="82" x2="48" y2="100" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Feet -->
  <line x1="76" y1="108" x2="86" y2="108" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="42" y1="102" x2="52" y2="102" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Speed lines behind -->
  <g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" opacity="0.4">
    <line x1="20" y1="50" x2="35" y2="50"/>
    <line x1="15" y1="68" x2="32" y2="68"/>
    <line x1="22" y1="86" x2="38" y2="86"/>
  </g>
</svg>
