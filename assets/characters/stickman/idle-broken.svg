<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Dev Stickman: IDLE-BROKEN
       Same pose as idle.svg but with worried face + cracked red laptop. -->

  <!-- Head -->
  <circle cx="64" cy="28" r="14" fill="#fcd9b6" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M53 22 Q58 14 64 16 Q70 14 75 22" fill="#2c1810" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Glasses -->
  <circle cx="58" cy="29" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="70" cy="29" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="62" y1="29" x2="66" y2="29" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Worried mouth (flat with slight downturn at edges) -->
  <path d="M60 37 Q64 35 68 37" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Sweat drop on temple -->
  <ellipse cx="78" cy="24" rx="2" ry="3" fill="#7ec8ff" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Neck + body line -->
  <line x1="64" y1="42" x2="64" y2="84" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Arms holding laptop -->
  <line x1="64" y1="52" x2="46" y2="72" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="52" x2="82" y2="72" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== CRACKED OPEN LAPTOP ===== -->
  <polygon points="40,56 88,56 84,68 44,68"
           fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Red error screen instead of blue -->
  <polygon points="44,58 84,58 81,66 47,66" fill="#cc3333"/>
  <!-- Crack zig-zags across the red screen -->
  <g stroke="#1a1a1a" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M48 59 L54 64 L51 63 L58 65"/>
    <path d="M76 59 L70 63 L74 64 L68 65"/>
    <line x1="64" y1="58" x2="62" y2="66"/>
  </g>
  <!-- Hinge line -->
  <line x1="44" y1="68" x2="84" y2="68" stroke="#1a1a1a" stroke-width="1.2"/>
  <!-- Keyboard base -->
  <polygon points="44,68 84,68 86,76 42,76"
           fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
  <!-- Smashed/scattered keys -->
  <g fill="#1a1a1a" opacity="0.55">
    <rect x="46" y="70" width="3" height="1.5" rx="0.3"/>
    <rect x="51" y="70" width="3" height="1.5" rx="0.3" transform="rotate(12 52 70)"/>
    <rect x="56" y="70" width="3" height="1.5" rx="0.3"/>
    <rect x="61" y="70" width="3" height="1.5" rx="0.3"/>
    <rect x="66" y="70" width="3" height="1.5" rx="0.3" transform="rotate(-8 67 70)"/>
    <rect x="71" y="70" width="3" height="1.5" rx="0.3"/>
    <rect x="76" y="70" width="3" height="1.5" rx="0.3"/>
    <rect x="48" y="73" width="3" height="1.5" rx="0.3"/>
    <rect x="58" y="73" width="3" height="1.5" rx="0.3" transform="rotate(15 59 73)"/>
    <rect x="68" y="73" width="3" height="1.5" rx="0.3"/>
    <rect x="73" y="73" width="3" height="1.5" rx="0.3"/>
  </g>

  <!-- Legs -->
  <line x1="64" y1="84" x2="54" y2="110" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="84" x2="74" y2="110" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Feet -->
  <line x1="50" y1="112" x2="58" y2="112" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="70" y1="112" x2="78" y2="112" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
</svg>
