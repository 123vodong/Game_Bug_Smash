<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Dev Stickman: JUMP pose
       Airborne, knees tucked, laptop held overhead/sideways with one hand -->

  <!-- Head: looking forward, mouth open with effort -->
  <circle cx="64" cy="24" r="14" fill="#fcd9b6" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Hair flying up -->
  <path d="M52 18 Q58 8 64 10 Q72 8 78 18" fill="#2c1810" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Glasses -->
  <circle cx="58" cy="25" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="70" cy="25" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="62" y1="25" x2="66" y2="25" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Mouth: open shout -->
  <ellipse cx="64" cy="33" rx="3" ry="2.5" fill="#1a1a1a"/>

  <!-- Body line (compressed because airborne) -->
  <line x1="64" y1="38" x2="64" y2="72" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Arms: one swung up (laptop side), one swung back for balance -->
  <line x1="64" y1="46" x2="86" y2="36" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="46" x2="44" y2="58" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== OPEN LAPTOP, raised up to side ===== -->
  <g transform="rotate(35 90 32)">
    <polygon points="78,24 102,24 100,32 80,32"
             fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="81,25 99,25 97.5,31 82.5,31" fill="#4aa3ff"/>
    <line x1="83" y1="27" x2="93" y2="27" stroke="#fff" stroke-width="0.7" opacity="0.8"/>
    <line x1="83" y1="29" x2="96" y2="29" stroke="#fff" stroke-width="0.7" opacity="0.8"/>
    <line x1="80" y1="32" x2="100" y2="32" stroke="#1a1a1a" stroke-width="1"/>
    <polygon points="80,32 100,32 102,38 78,38"
             fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
    <g fill="#1a1a1a" opacity="0.55">
      <rect x="82" y="33.5" width="2" height="1" rx="0.2"/>
      <rect x="85" y="33.5" width="2" height="1" rx="0.2"/>
      <rect x="88" y="33.5" width="2" height="1" rx="0.2"/>
      <rect x="91" y="33.5" width="2" height="1" rx="0.2"/>
      <rect x="94" y="33.5" width="2" height="1" rx="0.2"/>
      <rect x="97" y="33.5" width="2" height="1" rx="0.2"/>
    </g>
  </g>

  <!-- Legs: knees bent, feet pulled up (airborne tuck) -->
  <line x1="64" y1="72" x2="50" y2="86" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="86" x2="58" y2="100" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="72" x2="78" y2="86" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="78" y1="86" x2="70" y2="100" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Feet -->
  <line x1="54" y1="102" x2="62" y2="102" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="66" y1="102" x2="74" y2="102" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Speed puff lines below feet (jump lift-off) -->
  <g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <line x1="38" y1="120" x2="50" y2="120"/>
    <line x1="56" y1="124" x2="72" y2="124"/>
    <line x1="78" y1="120" x2="90" y2="120"/>
  </g>
</svg>
