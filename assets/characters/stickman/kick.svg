<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Dev Stickman: KICK pose
       Forward leg extended into a high kick, laptop tucked behind for balance -->

  <!-- Head, tilted slightly back from kick momentum -->
  <circle cx="58" cy="30" r="14" fill="#fcd9b6" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Hair -->
  <path d="M46 24 Q52 14 58 16 Q66 14 72 24" fill="#2c1810" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Glasses -->
  <circle cx="52" cy="31" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="64" cy="31" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="56" y1="31" x2="60" y2="31" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Angry brows -->
  <line x1="46" y1="25" x2="54" y2="29" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="70" y1="25" x2="62" y2="29" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

  <!-- Mouth: shout -->
  <ellipse cx="58" cy="39" rx="3" ry="2" fill="#1a1a1a"/>

  <!-- Body leaning back to extend the kick -->
  <line x1="58" y1="44" x2="54" y2="80" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Back arm holding laptop behind, front arm thrown forward for balance -->
  <line x1="56" y1="52" x2="34" y2="58" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="58" y1="54" x2="80" y2="50" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== LAPTOP held behind (defensive carry) ===== -->
  <g transform="rotate(-25 24 60)">
    <polygon points="14,52 38,52 36,60 16,60"
             fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
    <polygon points="17,53 35,53 33.5,59 18.5,59" fill="#4aa3ff"/>
    <line x1="19" y1="55" x2="29" y2="55" stroke="#fff" stroke-width="0.7" opacity="0.8"/>
    <line x1="19" y1="57" x2="32" y2="57" stroke="#fff" stroke-width="0.7" opacity="0.8"/>
    <line x1="16" y1="60" x2="36" y2="60" stroke="#1a1a1a" stroke-width="1"/>
    <polygon points="16,60 36,60 38,66 14,66"
             fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <!-- Support leg: bent, holding weight -->
  <line x1="54" y1="80" x2="46" y2="100" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="46" y1="100" x2="50" y2="112" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Kicking leg: extended forward + up (the big move) -->
  <line x1="54" y1="80" x2="84" y2="72" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="84" y1="72" x2="108" y2="68" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>

  <!-- Support foot -->
  <line x1="46" y1="114" x2="56" y2="114" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <!-- Kicking foot (forward, big arc) -->
  <line x1="106" y1="66" x2="116" y2="64" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>

  <!-- Kick impact lines radiating from the foot -->
  <g stroke="#ffd23f" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="116" y1="58" x2="122" y2="54"/>
    <line x1="118" y1="64" x2="126" y2="64"/>
    <line x1="116" y1="70" x2="122" y2="74"/>
  </g>
</svg>
