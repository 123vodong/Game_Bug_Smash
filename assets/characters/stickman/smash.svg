<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Dev Stickman: SMASH pose
       Open laptop raised overhead mid-swing, lunge stance, intense face -->

  <!-- Head: looking down at target -->
  <circle cx="64" cy="40" r="14" fill="#fcd9b6" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Hair, wild from swing -->
  <path d="M52 36 Q58 26 64 28 Q72 26 78 36" fill="#2c1810" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Glasses -->
  <circle cx="58" cy="42" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="70" cy="42" r="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="62" y1="42" x2="66" y2="42" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Angry brows -->
  <line x1="52" y1="36" x2="60" y2="40" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="76" y1="36" x2="68" y2="40" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>

  <!-- Mouth: grimace / shout -->
  <ellipse cx="64" cy="50" rx="3.5" ry="2.5" fill="#1a1a1a"/>

  <!-- Body: slightly leaning forward -->
  <line x1="64" y1="54" x2="60" y2="86" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Both arms raised overhead -->
  <line x1="63" y1="58" x2="50" y2="32" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="65" y1="58" x2="78" y2="32" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- ===== OPEN LAPTOP held overhead, screen pointed forward as a weapon ===== -->
  <g transform="rotate(-8 64 18)">
    <!-- Screen panel (bigger, prominent at impact angle) -->
    <polygon points="38,4 90,4 86,18 42,18"
             fill="#2a2a2a" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="42,6 86,6 83,17 45,17" fill="#4aa3ff"/>
    <!-- Screen content lines -->
    <line x1="46" y1="9"  x2="64" y2="9"  stroke="#fff" stroke-width="0.9" opacity="0.85"/>
    <line x1="46" y1="12" x2="78" y2="12" stroke="#fff" stroke-width="0.9" opacity="0.85"/>
    <line x1="46" y1="15" x2="60" y2="15" stroke="#fff" stroke-width="0.9" opacity="0.85"/>
    <!-- Hinge -->
    <line x1="42" y1="18" x2="86" y2="18" stroke="#1a1a1a" stroke-width="1.2"/>
    <!-- Keyboard base (folded back a bit since being swung) -->
    <polygon points="42,18 86,18 88,28 40,28"
             fill="#3a3a3a" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Keys -->
    <g fill="#1a1a1a" opacity="0.55">
      <rect x="44" y="20" width="3" height="1.5" rx="0.3"/>
      <rect x="49" y="20" width="3" height="1.5" rx="0.3"/>
      <rect x="54" y="20" width="3" height="1.5" rx="0.3"/>
      <rect x="59" y="20" width="3" height="1.5" rx="0.3"/>
      <rect x="64" y="20" width="3" height="1.5" rx="0.3"/>
      <rect x="69" y="20" width="3" height="1.5" rx="0.3"/>
      <rect x="74" y="20" width="3" height="1.5" rx="0.3"/>
      <rect x="79" y="20" width="3" height="1.5" rx="0.3"/>
      <rect x="46" y="23" width="3" height="1.5" rx="0.3"/>
      <rect x="51" y="23" width="3" height="1.5" rx="0.3"/>
      <rect x="56" y="23" width="3" height="1.5" rx="0.3"/>
      <rect x="61" y="23" width="3" height="1.5" rx="0.3"/>
      <rect x="66" y="23" width="3" height="1.5" rx="0.3"/>
      <rect x="71" y="23" width="3" height="1.5" rx="0.3"/>
      <rect x="76" y="23" width="3" height="1.5" rx="0.3"/>
    </g>
  </g>

  <!-- Motion arc above the laptop showing swing -->
  <g stroke="#1a1a1a" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M38 2 Q56 -2 74 2"/>
    <path d="M28 8 Q52 4 78 8"/>
  </g>

  <!-- Front leg: lunge bent forward -->
  <line x1="60" y1="86" x2="80" y2="104" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <!-- Back leg: straight back -->
  <line x1="60" y1="86" x2="44" y2="112" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Feet -->
  <line x1="76" y1="106" x2="84" y2="106" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
  <line x1="40" y1="114" x2="48" y2="114" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>
</svg>
